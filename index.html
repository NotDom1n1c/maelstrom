<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAELSTROM — the order book as a vortex</title>
<meta name="description" content="Bitcoin's live order book as a vortex: height is the price, width is everything waiting to be bought or sold, the waist is the price right now. See the walls and what it takes to move the price.">
<meta name="theme-color" content="#0a0610">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0610'/%3E%3Cpath d='M6 5h20L18 16l8 11H6l8-11z' fill='none' stroke='%23ff2f7d' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700;900&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<canvas id="gl"></canvas>

<header class="top">
  <div class="mark"><i></i>MAELSTROM</div>
  <nav class="pairs" id="pairs"></nav>
  <div class="status" id="status"><i></i><span>connecting</span></div>
</header>

<section class="quote" aria-live="polite">
  <p class="pair" id="pairName">BTC <em>/</em> USDT</p>
  <p class="px" id="px">—</p>
  <p class="sub" id="sub"></p>
  <div class="press" id="press">
    <div class="bar"><i id="pb"></i></div>
    <p><b id="pBuy">—</b> buyers waiting <span>within ±0.5 %</span> <b id="pSell" class="r">—</b> sellers</p>
  </div>
</section>

<div class="ladder" id="ladder"></div>
<div class="walls" id="walls"></div>
<div class="scan" id="scan" hidden></div>

<footer class="foot">
  <canvas id="tape"></canvas>
  <p class="legend"><span><i class="b"></i>buy</span><span><i class="s"></i>sell</span><span id="tps">0 trades / s</span><span class="hint">drag to turn · scroll to zoom · point at the vortex to read a price</span><span class="src">public Binance data · not advice</span></p>
</footer>

<div class="nogl" id="nogl" hidden>This needs WebGL2.</div>
<script src="app.js?v=11"></script>
</body>
</html>
